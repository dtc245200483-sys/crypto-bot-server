<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background subtle glow -->
    <radialGradient id="lunarGlow" cx="40%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#c8d6e5" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>

    <!-- Chrome / Lunar Metallic Gradient -->
    <linearGradient id="moonBodyGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="28%" stop-color="#e2e8f0"/>
      <stop offset="60%" stop-color="#94a3b8"/>
      <stop offset="85%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Bright Lunar Rim Light -->
    <linearGradient id="rimLightGrad" x1="10%" y1="20%" x2="45%" y2="85%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.20"/>
    </linearGradient>

    <!-- Orbit Ring Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.40"/>
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.70"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Halo -->
  <circle cx="32" cy="32" r="28" fill="url(#lunarGlow)"/>

  <!-- Orbital Ellipse -->
  <ellipse cx="32" cy="32" rx="27" ry="11" transform="rotate(-28 32 32)" stroke="url(#orbitGrad)" stroke-width="1.3" stroke-dasharray="88 8 16 6" fill="none" opacity="0.85"/>

  <!-- Satellite Orb on the Ring -->
  <circle cx="53" cy="21" r="2.2" fill="#ffffff" filter="url(#softGlow)"/>
  <circle cx="53" cy="21" r="1.2" fill="#38bdf8"/>

  <!-- Main Lunar Crescent -->
  <!-- Outer circle arc, inner cutout curve -->
  <path d="M 32 6 
           C 46.36 6 58 17.64 58 32 
           C 58 46.36 46.36 58 32 58 
           C 22.18 58 13.68 52.54 9.3 44.52 
           C 20.85 46.5 35.8 41.2 41.5 28.5 
           C 44.8 21.2 42.2 12.8 37.6 7.8 
           C 35.8 6.6 33.9 6.2 32 6 Z" 
        fill="url(#moonBodyGrad)" 
        filter="url(#softGlow)"/>

  <!-- Inner Shading Depth -->
  <path d="M 32 6 
           C 46.36 6 58 17.64 58 32 
           C 58 46.36 46.36 58 32 58 
           C 22.18 58 13.68 52.54 9.3 44.52 
           C 20.85 46.5 35.8 41.2 41.5 28.5 
           C 44.8 21.2 42.2 12.8 37.6 7.8 
           C 35.8 6.6 33.9 6.2 32 6 Z" 
        stroke="url(#rimLightGrad)" 
        stroke-width="1.2" 
        fill="none"/>

  <!-- Delicate Lunar Craters (Monochromatic subtle depth) -->
  <ellipse cx="44" cy="26" rx="2.5" ry="3.2" fill="#64748b" opacity="0.45" transform="rotate(15 44 26)"/>
  <ellipse cx="47" cy="38" rx="3.0" ry="2.2" fill="#475569" opacity="0.5" transform="rotate(-10 47 38)"/>
  <circle cx="38" cy="46" r="1.8" fill="#475569" opacity="0.4"/>
  <circle cx="49" cy="30" r="1.2" fill="#94a3b8" opacity="0.45"/>

  <!-- Stellar Sparkle Point -->
  <path d="M 17 17 L 18 19 L 20 20 L 18 21 L 17 23 L 16 21 L 14 20 L 16 19 Z" fill="#ffffff" opacity="0.85"/>
  <circle cx="17" cy="20" r="0.8" fill="#e0f2fe"/>
</svg>
